name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Tipo de subida de versión"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      draft:
        description: "Crear la release como borrador"
        type: boolean
        default: false
      prerelease:
        description: "Marcar la release como prerelease"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version and commit
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pnpm version ${{ inputs.version_bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          node scripts/set-desktop-version.mjs "$VERSION"

          git add package.json pnpm-lock.yaml build/config.yml \
            build/windows/info.json build/windows/nsis/wails_tools.nsh \
            build/linux/nfpm/nfpm.yaml
          git commit -m "chore: bump version to v$VERSION"
          git push origin HEAD:${{ github.event.repository.default_branch }}

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: wails3 build GOOS=windows

      - name: Prepare release asset
        shell: bash
        run: cp bin/newpoke.exe "newpoke-${{ needs.prepare.outputs.version }}-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: newpoke-${{ needs.prepare.outputs.version }}-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: wails3 build GOOS=linux

      - name: Prepare release asset
        run: tar -czf "newpoke-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz" -C bin newpoke

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: newpoke-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(
            --title "NewPoke ${{ needs.prepare.outputs.tag }}"
            --target "${{ needs.prepare.outputs.sha }}"
            --generate-notes
          )
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${{ needs.prepare.outputs.tag }}" release/* "${args[@]}"
