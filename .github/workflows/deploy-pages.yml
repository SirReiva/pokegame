name: Deploy to GitHub Pages

# Se despliega cuando cambia la versión de package.json en master. El job `check`
# compara la versión actual con la última versión publicada en Pages (leyendo el
# package.json del último run exitoso de este workflow), así que un push normal
# sin bump de versión no vuelve a publicar. workflow_dispatch fuerza el despliegue.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Si se cancela a mitad, el deploy puede quedar a medias; mejor encolar.
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      version: ${{ steps.current.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: current
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Resolve last deployed version
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha=$(gh run list --workflow deploy-pages.yml --branch "$BRANCH" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)

          # Se trae solo ese commit para no clonar toda la historia en cada push.
          version=""
          if [ -n "$sha" ] && git fetch --depth=1 --quiet origin "$sha"; then
            version=$(git show "$sha:package.json" 2>/dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Última versión desplegada: ${version:-<ninguna>}"

      - name: Decide deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CURRENT: ${{ steps.current.outputs.version }}
          LAST: ${{ steps.last.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Despliegue manual forzado de la versión $CURRENT."
            deploy=true
          elif [ -z "$LAST" ]; then
            echo "No hay despliegue previo registrado; se publica $CURRENT."
            deploy=true
          elif [ "$CURRENT" != "$LAST" ]; then
            echo "La versión cambió ($LAST -> $CURRENT); se publica."
            deploy=true
          else
            echo "La versión sigue en $CURRENT; no se publica."
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: [check, build]
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
